name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Verify APK and signature
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          {
            echo "== APK =="; ls -l "$APK"
            echo; echo "== Signature =="; "$BT/apksigner" verify --verbose --print-certs "$APK"
            echo; echo "== Manifest summary =="; "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|launchable-activity|leanback|banner" || true
            echo; echo "== Contents =="; unzip -l "$APK" | grep -E "classes|upload.html|banner|ic_launcher" || true
          } 2>&1 | tee apk-diagnostics.txt
          cp "$APK" PhotoFrameTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFrameTV-apk
          path: PhotoFrameTV.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            apk-diagnostics.txt
            app/build/reports/
          if-no-files-found: ignore
