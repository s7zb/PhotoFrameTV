name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # CI runners are wiped every run, so Gradle would create a NEW random debug
      # signing key each time. Caching it keeps every build signed with the same key,
      # so a newer build can be installed over an older one.
      - name: Keep the same debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build debug APK
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Inspect the APK (integrity, signature, SDK levels, ABI, manifest)
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          {
            echo "APK: $(ls -l "$APK")"
            echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "build-tools used: $BT"
            echo; echo "=== apksigner verify ==="
            "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 || echo "SIGNATURE VERIFY FAILED"
            echo; echo "=== zip integrity ==="
            unzip -tq "$APK" 2>&1 || echo "ZIP INTEGRITY FAILED"
            echo; echo "=== native libraries / CPU ABIs ==="
            unzip -l "$APK" | grep -E ' lib/' || echo "none: pure Java/Kotlin APK, runs on any CPU ABI"
            echo; echo "=== manifest summary (aapt2 badging) ==="
            "$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|uses-feature|launchable-activity|leanback-launchable-activity|native-code|application-debuggable)" || true
          } | tee apk-report.txt
          { echo "## APK inspection"; echo '```'; cat apk-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFrameTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-report
          path: apk-report.txt
          if-no-files-found: ignore

  # Installs the freshly built APK on a real Android TV emulator and tests it for real,
  # including the photo upload over HTTP. This job never blocks the APK download above.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]   # 28 = Android 9 (Mi TV Stick 1080p), 30 = Android 11 (Mi TV Stick 4K)
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: PhotoFrameTV-debug-apk
          path: apk

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write test script
        run: |
          cat > install-test.sh <<'EOF'
          #!/usr/bin/env bash
          API="$1"
          APK=apk/app-debug.apk
          PKG=com.photoframe.tv
          exec > "report-api$API.txt" 2>&1

          echo "=== device: Android $(adb shell getprop ro.build.version.release | tr -d '\r') (API $(adb shell getprop ro.build.version.sdk | tr -d '\r')), ABI $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "leanback feature: $(adb shell pm list features | tr -d '\r' | grep -i leanback || echo MISSING)"

          echo; echo "=== adb install (prints the real result the file manager hides) ==="
          adb install -r "$APK"
          echo "adb exit code: $?"

          echo; echo "=== package registered? ==="
          adb shell pm list packages "$PKG" | tr -d '\r'
          adb shell dumpsys package "$PKG" | tr -d '\r' | grep -E "versionName|minSdk|targetSdk|codePath|installerPackageName" | head

          echo; echo "=== shows up in the Android TV launcher (leanback)? ==="
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER "$PKG" | tr -d '\r'

          echo; echo "=== screensaver service registered? ==="
          adb shell cmd package query-services -a android.service.dreams.DreamService | tr -d '\r' | grep -i photoframe || echo "NOT FOUND"

          echo; echo "=== launch app ==="
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" | tr -d '\r'
          sleep 8
          echo "process id: $(adb shell pidof $PKG | tr -d '\r')  (empty = app not running)"
          echo "--- crash log (empty = no crash) ---"
          adb logcat -d -b crash | tr -d '\r'

          echo; echo "=== end-to-end upload test over HTTP ==="
          TOKEN=$(adb shell run-as "$PKG" cat shared_prefs/frame.xml | tr -d '\r' | sed -n 's/.*name="token">\([0-9a-f]*\)<.*/\1/p')
          echo "token from app: ${TOKEN:-NOT FOUND}"
          adb forward tcp:8080 tcp:8080
          echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg== | base64 -d > t.png
          echo "upload page HTTP status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)"
          echo "upload with token:  $(curl -s -X POST --data-binary @t.png -H 'Content-Type: application/octet-stream' "http://localhost:8080/api/upload?t=$TOKEN&name=t.png")"
          echo "photo count:        $(curl -s "http://localhost:8080/api/count?t=$TOKEN")"
          echo "upload wrong token: HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @t.png 'http://localhost:8080/api/upload?t=wrong')  (403 expected)"
          echo "files stored on device:"; adb shell run-as "$PKG" ls files/photos | tr -d '\r'
          EOF

      - name: Run install test on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash install-test.sh ${{ matrix.api }}

      - name: Show test report
        if: always()
        run: |
          {
            echo "## Install test: Android TV emulator, API ${{ matrix.api }}"
            echo '```'
            cat "report-api${{ matrix.api }}.txt" 2>/dev/null || echo "no report produced (emulator failed to start)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-report-api${{ matrix.api }}
          path: report-api${{ matrix.api }}.txt
          if-no-files-found: ignore
