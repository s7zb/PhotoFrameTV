<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add photos to your TV</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #201c19;
    --line: #3a332e;
    --text: #f4efe9;
    --dim: #a89f96;
    --accent: #ffb454;
    --ok: #7fd18b;
    --err: #ff7a6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.4;
    padding: 20px 16px 48px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin: 0 0 22px; }
  .pick {
    display: block; width: 100%;
    background: var(--accent); color: #2a1a05;
    border: 0; border-radius: 14px;
    font: inherit; font-size: 20px; font-weight: 700;
    padding: 20px 16px; cursor: pointer;
  }
  .pick:active { transform: scale(0.99); }
  .pick:focus-visible, .retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  input[type=file] { display: none; }
  .opt { display: flex; gap: 10px; align-items: center; color: var(--dim); margin: 14px 2px 6px; font-size: 15px; }
  .opt input { width: 20px; height: 20px; accent-color: var(--accent); }
  .cap { width: 100%; margin-top: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; }
  .cap:focus-visible { outline: 2px solid var(--accent); }
  .go { display: none; width: 100%; margin-top: 14px; background: none; color: var(--accent); border: 2px solid var(--accent);
    border-radius: 12px; font: inherit; font-size: 18px; font-weight: 700; padding: 14px; cursor: pointer; }
  .tvcount { color: var(--dim); font-size: 15px; margin: 4px 2px 0; min-height: 22px; }
  #summary { margin: 22px 2px 10px; font-weight: 600; min-height: 24px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 56px 1fr; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .thumb { width: 56px; height: 56px; border-radius: 8px; background: var(--panel); object-fit: cover; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 7px 0 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  li.done .bar > i { background: var(--ok); }
  li.fail .bar > i { background: var(--err); }
  li.done .status { color: var(--ok); }
  li.fail .status { color: var(--err); }
  .retry {
    background: none; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 14px; margin-top: 6px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
  <h1>Add photos to your TV</h1>
  <p class="sub">Pick as many as you like. They appear in the slideshow right after they finish.</p>

  <button class="pick" id="pick" type="button">Choose photos</button>
  <input id="file" type="file" accept="image/*" multiple>

  <label class="opt"><input type="checkbox" id="resize" checked> Shrink very large photos (faster, looks the same on a TV)</label>
  <label class="opt"><input type="checkbox" id="capbox"> Add a caption to each photo (shown on the TV if captions are on)</label>
  <button class="go" id="go" type="button">Upload photos</button>
  <div class="tvcount" id="tvcount"></div>

  <div id="summary"></div>
  <ul id="list"></ul>

<script>
(function () {
  var fileInput = document.getElementById('file');
  var list = document.getElementById('list');
  var summary = document.getElementById('summary');
  var tvcount = document.getElementById('tvcount');
  var resizeBox = document.getElementById('resize');
  var capBox = document.getElementById('capbox');
  var goBtn = document.getElementById('go');
  var MAX_SIDE = 2560;

  var queue = [], running = false, total = 0, done = 0, failed = 0;

  document.getElementById('pick').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    for (var i = 0; i < fileInput.files.length; i++) addFile(fileInput.files[i]);
    fileInput.value = '';
    if (capBox.checked) { goBtn.style.display = 'block'; goBtn.textContent = 'Upload ' + queue.length + (queue.length === 1 ? ' photo' : ' photos'); }
    else run();
  });
  goBtn.addEventListener('click', function () { goBtn.style.display = 'none'; run(); });

  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  function addFile(file) {
    var li = document.createElement('li');
    var img = document.createElement('img');
    img.className = 'thumb';
    img.alt = '';
    try { img.src = URL.createObjectURL(file); } catch (e) {}
    var box = document.createElement('div');
    var name = document.createElement('div'); name.className = 'name'; name.textContent = file.name;
    var bar = document.createElement('div'); bar.className = 'bar';
    var fill = document.createElement('i'); bar.appendChild(fill);
    var meta = document.createElement('div'); meta.className = 'meta';
    var status = document.createElement('span'); status.className = 'status'; status.textContent = 'Waiting';
    var size = document.createElement('span'); size.textContent = fmt(file.size);
    meta.appendChild(status); meta.appendChild(size);
    box.appendChild(name); box.appendChild(bar); box.appendChild(meta);
    li.appendChild(img); li.appendChild(box);
    list.insertBefore(li, list.firstChild);
    var capInput = null;
    if (capBox.checked) {
      capInput = document.createElement('input');
      capInput.type = 'text'; capInput.className = 'cap'; capInput.maxLength = 120;
      capInput.placeholder = 'Caption (optional)';
      box.insertBefore(capInput, box.children[1]);
    }
    var item = { file: file, li: li, fill: fill, status: status, size: size, box: box, cap: capInput };
    total++;
    queue.push(item);
    updateSummary();
  }

  function updateSummary() {
    if (!total) { summary.textContent = ''; return; }
    var s = done + ' of ' + total + ' uploaded';
    if (failed) s += ', ' + failed + ' failed';
    summary.textContent = s;
  }

  function loadCount() {
    var x = new XMLHttpRequest();
    x.open('GET', '/count');
    x.onload = function () {
      try { var n = JSON.parse(x.responseText).count; tvcount.textContent = n + (n === 1 ? ' photo' : ' photos') + ' on the TV'; } catch (e) {}
    };
    x.send();
  }

  async function run() {
    if (running) return;
    running = true;
    while (queue.length) { await upload(queue.shift()); }
    running = false;
    updateSummary();
    loadCount();
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      im.src = url;
    });
  }

  async function prepare(file) {
    var orig = { blob: file, name: file.name };
    var isHeic = /^image\/hei[cf]/i.test(file.type) || /\.(heic|heif)$/i.test(file.name);
    // HEIC/HEIF is always converted to JPEG here when the phone's browser can decode it (the TV may not be able to).
    if (!isHeic && (!resizeBox.checked || file.size < 1500000 || !/^image\/(jpeg|png|webp)$/.test(file.type))) return orig;
    try {
      var im = await loadImage(file);
      var w = im.naturalWidth, h = im.naturalHeight;
      var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
      if (scale >= 1 && !isHeic) return orig;
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var blob = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.9); });
      if (!blob) return orig;
      if (!isHeic && blob.size >= file.size) return orig;
      return { blob: blob, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', converted: isHeic };
    } catch (e) {
      if (isHeic) orig.heicRaw = true;
      return orig;
    }
  }

  function fail(it, msg) {
    it.li.className = 'fail';
    it.fill.style.width = '100%';
    it.status.textContent = msg;
    failed++;
    var b = document.createElement('button');
    b.className = 'retry'; b.type = 'button'; b.textContent = 'Try again';
    b.addEventListener('click', function () {
      b.remove();
      failed--; it.li.className = ''; it.fill.style.width = '0';
      it.status.textContent = 'Waiting';
      queue.push(it); updateSummary(); run();
    });
    it.box.appendChild(b);
    updateSummary();
  }

  function upload(it) {
    return new Promise(async function (resolve) {
      it.status.textContent = 'Preparing';
      var p = await prepare(it.file);
      it.size.textContent = fmt(p.blob.size);
      it.status.textContent = p.heicRaw ? 'Sending HEIC as is (this phone cannot convert it)' : 'Uploading 0%';
      var x = new XMLHttpRequest();
      var capText = it.cap ? it.cap.value.trim() : '';
      if (it.cap) it.cap.disabled = true;
      x.open('POST', '/upload?name=' + encodeURIComponent(p.name) + (capText ? '&caption=' + encodeURIComponent(capText) : ''));
      x.setRequestHeader('Content-Type', p.blob.type || 'application/octet-stream');
      x.timeout = 5 * 60 * 1000;
      x.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round(e.loaded / e.total * 100);
        it.fill.style.width = pct + '%';
        it.status.textContent = pct >= 100 ? 'Saving on TV' : 'Uploading ' + pct + '%';
      };
      x.onload = function () {
        var res = {};
        try { res = JSON.parse(x.responseText); } catch (e) {}
        if (x.status === 200 && res.ok) {
          it.li.className = 'done';
          it.fill.style.width = '100%';
          it.status.textContent = p.converted ? 'On the TV (converted to JPEG)' : 'On the TV';
          done++;
          updateSummary();
        } else {
          fail(it, res.error || ('The TV returned error ' + x.status));
        }
        resolve();
      };
      x.onerror = function () { fail(it, 'Lost connection. Check that your phone is on the same Wi-Fi as the TV.'); resolve(); };
      x.ontimeout = function () { fail(it, 'Timed out. Move closer to the router and try again.'); resolve(); };
      x.send(p.blob);
    });
  }

  loadCount();
})();
</script>
</body>
</html>
