<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Send photos to TV</title>
<style>
  :root{--bg:#14171a;--card:#1f242a;--fg:#fff;--mut:#90a4ae;--acc:#4fc3f7;--ok:#66bb6a;--err:#ef5350}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--fg);
       padding:16px 16px 120px;padding-top:max(16px,env(safe-area-inset-top))}
  h1{font-size:22px;margin:4px 0}
  .sub{color:var(--mut);margin:0 0 16px;font-size:14px}
  .btn{display:block;width:100%;padding:16px;border-radius:12px;border:0;font-size:17px;font-weight:600;
       text-align:center;margin-bottom:12px;cursor:pointer}
  .pick{background:var(--card);color:var(--acc);border:2px dashed var(--acc)}
  #send{background:var(--acc);color:#00293a}
  #send:disabled{opacity:.4}
  .err{background:#3b1f1f;color:#ffab91;padding:12px;border-radius:10px;margin-bottom:12px;font-size:14px}
  .bar{height:8px;background:#2f363d;border-radius:4px;overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--acc);transition:width .15s}
  #overall{margin:4px 0 16px}
  #otext{font-size:14px;color:var(--mut);margin-top:6px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .card{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card)}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card .bar{position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0}
  .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
         display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
  .done .badge{display:flex;background:var(--ok)} .fail .badge{display:flex;background:var(--err)}
  .up img{opacity:.6}
  .fail .msg{position:absolute;left:0;right:0;bottom:6px;background:#000a;color:#ffab91;font-size:10px;padding:2px 4px}
  .msg{display:none} .fail .msg{display:block}
  footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent,var(--bg) 30%)}
  footer .btn{margin:0}
</style>
</head>
<body>
<h1>📺 Send photos to TV</h1>
<p class="sub">Photos on TV: <b id="count">–</b></p>
<div id="tokerr" class="err" hidden>This page needs the link from the TV. Scan the QR code on your TV again.</div>

<label class="btn pick" for="file">＋ Choose photos from gallery</label>
<input id="file" type="file" accept="image/*" multiple hidden>

<div id="overall" hidden>
  <div class="bar"><div id="obar"></div></div>
  <div id="otext"></div>
</div>
<div id="grid"></div>

<footer><button id="send" class="btn" disabled>Upload to TV</button></footer>

<script>
(function(){
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function(id){return document.getElementById(id)};
  var items = [], busy = false;
  var MAX_SIDE = 2560;
  if(!token) $('tokerr').hidden = false;

  function api(p){ return p + (p.indexOf('?')<0?'?':'&') + 't=' + encodeURIComponent(token); }

  function refreshCount(){
    fetch(api('/api/count'),{cache:'no-store'}).then(function(r){return r.json()})
      .then(function(j){ if(j && j.count!=null) $('count').textContent=j.count; }).catch(function(){});
  }
  refreshCount();

  $('file').addEventListener('change', function(e){
    Array.prototype.forEach.call(e.target.files, addItem);
    e.target.value = '';
    updateUi();
  });
  $('send').addEventListener('click', run);

  function addItem(file){
    var el = document.createElement('div'); el.className = 'card';
    var img = document.createElement('img'); img.loading='lazy'; img.decoding='async';
    img.src = URL.createObjectURL(file);
    var bar = document.createElement('div'); bar.className='bar'; var fill=document.createElement('div'); bar.appendChild(fill);
    var badge = document.createElement('div'); badge.className='badge'; badge.textContent='✓';
    var msg = document.createElement('div'); msg.className='msg';
    el.appendChild(img); el.appendChild(bar); el.appendChild(badge); el.appendChild(msg);
    $('grid').appendChild(el);
    items.push({file:file, el:el, fill:fill, badge:badge, msg:msg, state:'wait'});
  }

  function pending(){ return items.filter(function(i){return i.state==='wait'||i.state==='fail'}); }

  function updateUi(){
    var n = pending().length;
    var failed = items.some(function(i){return i.state==='fail'});
    $('send').disabled = busy || n===0;
    $('send').textContent = busy ? 'Uploading…' : (n===0 ? 'Upload to TV' : (failed?'Retry / upload ':'Upload ')+n+' photo'+(n>1?'s':'')+' to TV');
  }

  function setState(it, st, text){
    it.state = st;
    it.el.className = 'card ' + st;
    if(st==='done'){ it.fill.style.width='100%'; it.badge.textContent='✓'; }
    if(st==='fail'){ it.badge.textContent='!'; it.msg.textContent = text||'Failed'; }
  }

  function loadImg(file){
    return new Promise(function(res,rej){
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function(){ res({im:im,u:u}); };
      im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('decode')); };
      im.src = u;
    });
  }

  // Downscale big photos in the browser (faster upload, bakes in EXIF rotation). Falls back to the original.
  function prepare(file){
    if(!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type||'image/jpeg')) return Promise.resolve({blob:file,name:file.name});
    return loadImg(file).then(function(o){
      var w=o.im.naturalWidth, h=o.im.naturalHeight, s=Math.min(1, MAX_SIDE/Math.max(w,h));
      if(s===1 && file.size < 3*1024*1024){ URL.revokeObjectURL(o.u); return {blob:file,name:file.name}; }
      var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(o.im,0,0,c.width,c.height);
      URL.revokeObjectURL(o.u);
      return new Promise(function(res){
        c.toBlob(function(b){
          c.width=c.height=0;
          if(!b) return res({blob:file,name:file.name});
          res({blob:b,name:(file.name||'photo').replace(/\.[^.]*$/,'')+'.jpg'});
        },'image/jpeg',0.9);
      });
    }).catch(function(){ return {blob:file,name:file.name}; });
  }

  function send(it, p, onFrac){
    return new Promise(function(res,rej){
      var x = new XMLHttpRequest();
      x.open('POST', api('/api/upload?name='+encodeURIComponent(p.name||'photo.jpg')));
      x.setRequestHeader('Content-Type','application/octet-stream');
      x.upload.onprogress = function(e){ if(e.lengthComputable){ var f=e.loaded/e.total; it.fill.style.width=(f*100)+'%'; onFrac(f);} };
      x.onload = function(){
        if(x.status===200) return res();
        var m='Upload failed'; try{ m=JSON.parse(x.responseText).error||m; }catch(_){}
        rej(new Error(m));
      };
      x.onerror = function(){ rej(new Error('Connection lost')); };
      x.send(p.blob);
    });
  }

  function run(){
    if(busy) return;
    var todo = pending(); if(!todo.length) return;
    busy = true; updateUi();
    $('overall').hidden = false;
    var total = todo.length, done = 0, ok = 0;
    function overall(frac){
      $('obar').style.width = (((done+(frac||0))/total)*100)+'%';
      $('otext').textContent = 'Uploading '+Math.min(done+1,total)+' of '+total+'…';
    }
    overall(0);
    todo.reduce(function(chain,it){
      return chain.then(function(){
        setState(it,'up'); it.fill.style.width='0';
        return prepare(it.file).then(function(p){ return send(it,p,overall); })
          .then(function(){ setState(it,'done'); ok++; })
          .catch(function(e){ setState(it,'fail',e.message); })
          .then(function(){ done++; overall(0); });
      });
    }, Promise.resolve()).then(function(){
      busy = false;
      $('obar').style.width='100%';
      var fail = total-ok;
      $('otext').textContent = '✓ '+ok+' photo'+(ok===1?'':'s')+' sent to your TV'+(fail?' — '+fail+' failed (tap to retry)':'');
      updateUi(); refreshCount();
    });
  }
})();
</script>
</body>
</html>
